[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-osint"
version = "0.1.0"
description = "Modular OSINT framework for email, username, domain, and IP intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "python-whois>=0.8",
    "dnspython>=2.6",
    "ipwhois>=1.2",
]

[project.scripts]
spectra = "osint.cli:main"

[tool.setuptools.packages.find]
include = ["osint*"]